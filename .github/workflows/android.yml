name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavení Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Vytvoření wrapperu, pokud chybí
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Sestavení debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Nahrání APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: mereni-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
